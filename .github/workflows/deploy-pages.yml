name: Publicar site (docs/) no GitHub Pages

on:
  push:
    branches: [main, merge/test-interpretability]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar docs/ como artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
